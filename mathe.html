    questions.sort((a, b) => a[0] - b[0]);

    let currentDifficulty = parseInt(localStorage.getItem("currentDifficulty")) || 1;
    let correctStreak = getStreak(currentDifficulty);
    let highScore = getHighScore(currentDifficulty);
    const initialQuestions = questions.filter(q => q[0] === currentDifficulty);

    let questionIndex = Math.floor(Math.random() * initialQuestions.length);
    let isAnswerSubmitted = false;

    function formatMath(text) 
    {
      return text
        .replace(/\s*\^2\s*/g, '²')
        .replace(/\s*\^3\s*/g, '³')
        .replace(/\b1\/2\b/, '½');
    }

    function loadQuestion() 
    {
      const difficultyQuestions = questions.filter(q => q[0] === currentDifficulty);

      if (difficultyQuestions.length === 0) 
      {
        document.getElementById("questionBox").innerText = "Alle Fragen fertig!";
        document.getElementById("answerInput").style.display = "none";
        document.getElementById("actionButton").style.display = "none";
        document.getElementById("progressBar").style.display = "none";

        return;
      }

      highScore = getHighScore(currentDifficulty);
      correctStreak = getStreak(currentDifficulty);

      updateProgressBar();

      const [diff, q] = difficultyQuestions[questionIndex];

      document.getElementById("questionBox").innerText = `Schwierigkeitsgrad ${diff}:\n\n${formatMath(q)}`;
      document.getElementById("answerInput").value = "";
      document.getElementById("answerInput").disabled = false;
      document.getElementById("feedback").innerHTML = "";
      document.getElementById("actionButton").innerText = "Antwort prüfen";
    }


    function resetProgress() 
    {
      // go back one level 

      // Get current difficulty from localStorage
      let currentDifficulty = parseInt(localStorage.getItem("currentDifficulty"), 10);

      // Reset streak for current difficulty
      localStorage.setItem(`streak_${currentDifficulty}`, 0);

      // Go back one level, but not below 1
      let newDifficulty = currentDifficulty > 1 ? currentDifficulty - 1 : 1;

      // Reset this streak as well
      localStorage.setItem(`streak_${currentDifficulty}`, 0);

      // Update current difficulty
      localStorage.setItem("currentDifficulty", newDifficulty);

      alert(`Zurück zu Schwierigkeitsgrad ${newDifficulty}. Fortschritt auf aktuellem Level wurde zurückgesetzt.`);

      location.reload(); // Optional: reload to reflect change
    }


    function normalizeAnswer(str) 
    {
      return str
        .toLowerCase()
        .replace(/[\u00B2]/g, '^2')         // convert ² to ^2
        .replace(/[\u00B3]/g, '^3')         // convert ³ to ^3
        .replace(/\s*([+\-*/:])\s*/g, '$1') // remove spaces around operators
        .replace(/\s+(?=x|a|b)/g, '')       // remove space before variables
        .replace(/\s+/g, '');               // remove all other spaces
    }


    function submitAnswer() 
    {
      const difficultyQuestions = questions.filter(q => q[0] === currentDifficulty);
      const [diff, , correctAnswer, explanation] = difficultyQuestions[questionIndex];
      const userAnswer = document.getElementById("answerInput").value;

      const normalizedUser = normalizeAnswer(userAnswer);
      const normalizedCorrect = normalizeAnswer(correctAnswer);

      let resultText = "";

      if (normalizedUser === normalizedCorrect) 
      {
        correctStreak++;
        setStreak(diff, correctStreak);

        if (correctStreak > highScore) 
 	{
          highScore = correctStreak;
          setHighScore(diff, highScore);
        }

        resultText = `✅ Richtig!\n\n<span class="label">Deine Antwort:</span> ${formatMath(userAnswer)}\n<span class="label">Korrekte Antwort:</span> ${formatMath(correctAnswer)}\n\nErklärung:\n${explanation}`;

        if (correctStreak >= 10) 
        {
          currentDifficulty++;
	  localStorage.setItem("currentDifficulty", currentDifficulty);
          correctStreak = 0;
          setStreak(diff, 0);
          questionIndex = Math.floor(Math.random() * difficultyQuestions.length); //start with random number Q
        } 
        else 
        {
          questionIndex = (questionIndex + 1) % difficultyQuestions.length;
        }
      } 
      else // wrong answer
      {
        correctStreak = 0;
        setStreak(diff, 0);

        resultText = `❌ Falsch.\n\n<span class="label">Deine Antwort:</span> ${formatMath(userAnswer)}\n<span class="label">Korrekte Antwort:</span> ${formatMath(correctAnswer)}\n\nErklärung:\n${explanation}`;

        questionIndex = (questionIndex + 1) % difficultyQuestions.length;
      }

      document.getElementById("feedback").innerHTML = resultText;

      updateProgressBar();

      document.getElementById("answerInput").disabled = true;
      document.getElementById("actionButton").innerText = "Nächste Frage";
    }


    // toggle check answer and next question (I think)
	
    function handleAction() 
    {
      if (!isAnswerSubmitted) 
      {
        submitAnswer();
        isAnswerSubmitted = true;
      } 
      else 
      {
        isAnswerSubmitted = false;
        loadQuestion();
      }
    }


    function updateProgressBar() 
    {
      const total = 10;
      const bar = document.getElementById("progressBar");
      bar.innerHTML = "";

      for (let i = 0; i < total; i++) 
      {
        const notch = document.createElement("span");
        notch.className = "notch";
        notch.style.backgroundColor =
          i < correctStreak ? "green" :
          i < highScore ? "#ccffcc" : "lightgrey";
        bar.appendChild(notch);
      }
    }


    function setStreak(difficulty, value) 
    {
      localStorage.setItem(`streak_${difficulty}`, value);
    }


    function getStreak(difficulty) 
    {
      return parseInt(localStorage.getItem(`streak_${difficulty}`)) || 0;
    }


    function setHighScore(difficulty, value) 
    {
      localStorage.setItem(`high_${difficulty}`, value);
    }


    function getHighScore(difficulty) 
    {
      return parseInt(localStorage.getItem(`high_${difficulty}`)) || 0;
    }


    // start here

    loadQuestion();

  </script>
