<!DOCTYPE html>
<html>
<head>
  <title>Boat Booking</title>
</head>
<body>
  <h2>Reserve a Boat</h2>
  <form id="bookingForm">

        <label for="date">Select a date:</label>
    <input type="date" id="date" name="date" required>
    <br><br>

    
    <label for="boat">Select a boat:</label>
    <select id="boat" name="boat">
      <option>Sea Kayak #1</option>
      <option>Sea Kayak #2</option>
      <option>Canoe #1</option>
      <option>Canoe #2</option>
      <option>Rubber Boat #1</option>
      <!-- Add all 50 boats -->
    </select>
    <br><br>


    <label for="name">Your name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <button type="submit">Book</button>
  </form>

  <div id="result" style="margin-top:15px;font-weight:bold;"></div>

  <h3>Current Bookings</h3>
  <!-- Google Calendar Embed -->
  <iframe src="https://calendar.google.com/calendar/embed?src=7888597ea008764c4f3531adced47949ff3d101d18e22c38d62308457f9b6a5a@group.calendar.google.com&ctz=GMT"
          style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Tabletop.js/1.5.1/tabletop.min.js"></script>
  <script>
    const SHEET_ID = //'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlX7g3U9NyWUY0LmRfIiB06itdY36yvrX5WWuRAk_osvwV38mH2KwxO-Qp_bRG8XG_mv8q5XmNE-52/pubhtml';
                      'https://docs.google.com/spreadsheets/d/1fuL8ho1R2JvpSeaC5M02mE1NHix4lslaU8BybF_fXVc/edit?usp=sharing';
    let bookings = [];

    // Load existing bookings
    function loadBookings() {
      Tabletop.init({
        key: SHEET_ID,
        simpleSheet: true,
        callback: function(data, tabletop) {
          bookings = data.map(row => ({
            date: row.Date,
            boat: row.Boat
          }));
        }
      });
    }

    loadBookings();

    const form = document.getElementById('bookingForm');

    ///
    <script>
const FORM_POST_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLScTzZaPcA6_hdgXWSokw5K-QLW0uXoL2425cIKflPNG6TQq9w/formResponse";

const ENTRY_DATE = "entry.2097693443";
const ENTRY_BOAT = "entry.1166974657";
const ENTRY_NAME = "entry.839337160";

form.addEventListener('submit', async e => {
  e.preventDefault();

  const boat = form.boat.value;
  const date = form.date.value; // yyyy-mm-dd
  const name = form.name.value;

  // Convert yyyy-mm-dd → dd/mm/yyyy
  const [yyyy, mm, dd] = date.split("-");
  const formatted = `${dd}/${mm}/${yyyy}`;

  const formData = new FormData();
  formData.append(ENTRY_DATE, formatted);
  formData.append(ENTRY_BOAT, boat);
  formData.append(ENTRY_NAME, name);

  await fetch(FORM_POST_URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  });

  document.getElementById('result').innerText =
    `Booking submitted for ${boat} on ${formatted}.`;
});

  </script>
</body>
</html>
