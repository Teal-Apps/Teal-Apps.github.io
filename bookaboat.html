<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 95dvh;
      display: grid;
      grid-template-columns: 1fr 1fr; /* calendar | form */
    }

    #calendar-area {
      border-right: 1px solid #ccc;
      position: relative;
      height: 100dvh;
      box-sizing: border-box;
      padding: 20px;
    }

    #calendar-area iframe {
      width: 100%;
      height: calc(100% - 55px); /* room for heading */
      border: none;
    }

    #form-area {
      position: relative;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }


    #form-area iframe {
      width: 100%;
      height: 60%;
      border: none;
    }


    /* for loading text */
    .wait {
      font-size: 22px;
      font-weight: 900;
      color: #d2d2d2;
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }

    /* Mobile layout: stack vertically */
    @media (max-width: 950px) {
      body {
        grid-template-columns: 1fr;
      }
      .wait {
        color: #ffffff;
      }
      #form-aread iframe {
	height: 90%;
      }
    }
  </style>
</head>

<body>

    <h2> Existing Reservations [<a href="#!" onClick="window.location.reload();">refresh</a>]</h2>
    <!-- calendar src inserted by script -->

  </div>
