<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 95dvh;
      display: grid;
      grid-template-columns: 1fr 1fr; /* calendar | form */
    }

    #calendar-area {
      border-right: 1px solid #ccc;
      position: relative;
      height: 100dvh;
      box-sizing: border-box;
      padding: 20px;
    }

    #calendar-area iframe {
      width: 100%;
      height: calc(100% - 55px); /* room for heading */
      border: none;
    }

    #form-area {
      position: relative;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }

    #form-area iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* for loading text */
    .wait {
      font-size: 22px;
      font-weight: 900;
      color: #d2d2d2;
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }

    /* Mobile layout: stack vertically */
    @media (max-width: 800px) {
      body {
        grid-template-columns: 1fr;
      }
      .wait {
        color: #ffffff;
      }
    }
  </style>
</head>

<body>

  <div id="calendar-area">
    <h2> Existing Reservations [<a href="#!" onClick="window.location.reload();">refresh</a>]</h2>
    <!-- calendar iframe inserted by script -->
  </div>

	
  <div id="form-area">
    <div id="loading" class=wait><br><br><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
											Loading, please wait...</div>
	  	If the reservation form doesn't load please <a href="https://script.google.com/macros/s/AKfycbxm6_PcIzpfikgZOmZGEzl-2kOY4G001rcs4wSXZneGoMAGw2XHjRwbKkaAimqurId8hg/exec">click here</a>.
    <!-- form iframe inserted by script --> 
  </div>

  <script>
//      <button onclick="window.location.href='https://script.google.com/macros/s/AKfycbxm6_PcIzpfikgZOmZGEzl-2kOY4G001rcs4wSXZneGoMAGw2XHjRwbKkaAimqurId8hg/exec'">
//      If the reservation form doesn't load please click here. </button>
	  
    // script to put date in calendar, otherwise today's all-day events won't show	
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, "0");
    const d = String(today.getDate()).padStart(2, "0");
    const dateStr = `${y}${m}${d}`;

    const url =
      `https://calendar.google.com/calendar/embed?mode=AGENDA` +
      `&showTitle=0&showNav=1&showDate=0&showPrint=1&showTabs=0&showCalendars=0&showTz=0` +
      `&src=7888597ea008764c4f3531adced47949ff3d101d18e22c38d62308457f9b6a5a@group.calendar.google.com` +
      `&ctz=GMT&dates=${dateStr}/${dateStr}`;

    document.getElementById("calendar-area").innerHTML +=
      `<iframe src="${url}" style="border:0" width="100%" height="100%"></iframe>`;

    // script to load form, adds a date to stop iphones from caching and blocking it  // doesn't seem to actually fix it...
    document.getElementById("form-area").innerHTML +=
	`<iframe id="formframe" src="https://script.googleusercontent.com/macros/s/AKfycbx1o8NhhlWvmaAgOX-iw99WKrqp0-cquU6WoHiTv_CXwcI7aWcQvhUTUDX7QJSDEnCKfQ/exec?t=` + Date.now() + `"</iframe>`;

	// iphone still didn't work, so add extra link in case it doesn't, it works directly from the google webapp
	const formframe = document.getElementById("formframe");
	const loading = document.getElementById("loading");
    const onfailure = document.getElementById("onfailure");
	
	// If it loads successfully
	formframe.onload = () => {
      loading.style.display = "none";
      onfailure.style.display = "none";
    };

    // If it fails (Safari, blocked, etc.)
    formframe.onerror = () => {
      loading.style.display = "none";
      onfailure.display = "block";
    };
	
  </script>

</body>
</html>
